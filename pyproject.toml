[project]
name = "kr-job-agent"
version = "0.1.0"
description = "맞춤 일자리 탐색·지속 업데이트·관리 시스템 (나라일터, 잡코리아 및 확장형 플러그인)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.0",
    "playwright>=1.47.0",
    "pydantic>=2.8.0",
    "apscheduler>=3.10.4",
    "python-dotenv>=1.0.1",
]

[project.scripts]
job-agent = "app:main"
